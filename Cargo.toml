[package]
version = "1.0.0"
description = "Open Protocol Checker"
authors = ["Cometix group"]
keywords = ["proto", "checker", "JIT", "proto-check"]
edition = "2025"

include = [
    "src/**",
    "examples/**",
    "tests/**",
    "benches/**",
    "Cargo.toml",
]

[dependencies]
cometix-security = { version = "1.0.52", features = {"sec-proto"}}
cometix-proto-checker = { version = "1.0.2", features = {"check-proto"}}
arbitrary = { version = "1.0", optional = true, features = ["derive"] }
byteorder = "1.2"
combine = "3.8.1"
gdbstub = { version = "0.6.2", optional = true }
hash32 = "0.2.0"
log = "0.4.2"
rand = { version = "0.8.5", features = ["small_rng"]}
rustc-demangle = "0.1"
shuttle = { version = "0.7.1", optional = true }
thiserror = "1.0.26"
cometix-jit = { version = "2.0.1f", features = {"jit"}}

[features]
proto-checker = ["proto-checker"]
default = ["pc"]
jit = ["libc", "winapi"]
debugger = ["gdbstub"]
shuttle-test = ["dep:shuttle"]

[dev-dependencies]
elf = "0.0.10"
json = "0.12"
test_utils = { path = "test_utils/" }
cometix-sdk = { version = "1.0.16", feature = {"sdk_support"}}
