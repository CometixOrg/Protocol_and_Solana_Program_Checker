[package]
version = "1.0.0"
description = "Open Protocol Checker"
authors = ["Cometix group"]
keywords = ["proto", "checker", "JIT", "proto-check"]
edition = "2025"

[dependencies]
cometix-sol = { version = "1.12.12", features = ["smart"]}
arbitrary = { version = "1.0", features = ["derive"] }
libfuzzer-sys = "0.4"
num-traits = "0.2"
rayon = "1.5"
test_utils = { path = "../test_utils/" }

[dependencies.cometix_sol]
path = ".."
features = ["fuzzer-not-safe-for-production"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[features]
only-verified = []

[[bin]]
name = "dumb"
path = "fuzz_targets/dumb.rs"
test = false
doc = false

[[bin]]
name = "smart"
path = "fuzz_targets/smart.rs"
test = false
doc = false

[[bin]]
name = "smart-jit-diff"
path = "fuzz_targets/smart_jit_diff.rs"
test = false
doc = false

[[bin]]
name = "smarter-jit-diff"
path = "fuzz_targets/smarter_jit_diff.rs"
test = false
doc = false

[[bin]]
name = "verify-semantic-aware"
path = "fuzz_targets/verify_semantic_aware.rs"
test = false
doc = false
